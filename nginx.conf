server {
    listen 8080 default_server;

    client_max_body_size 100M;

    # Assets (JS/CSS bundles especially) are shipped uncompressed by default;
    # gzip cuts text-based transfer sizes by roughly 70% with negligible CPU
    # cost, which is the single biggest lever on render-blocking/LCP timing.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Vite fingerprints every build asset's filename with a content hash
    # (index-<hash>.js, index-<hash>.css, fonts, images...), so it's always
    # safe to cache these forever: a new deploy produces new filenames.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # PDF extraction processes files sequentially with a rate-limit
        # delay per file (see MODEL_SLEEP_SECONDS in backend/main.py), so a
        # batch of several PDFs can take a few minutes. Worst case is a
        # mid-batch fallback to gemini-flash-latest (~90s/file incl.
        # sleep) rather than the primary gemini-3.5-flash-lite (~9s/file) —
        # sized for batches up to ~15 PDFs in that worst case (15 * 90s =
        # 1350s), with margin. Raise this further if you routinely batch
        # more files.
        proxy_connect_timeout 300s;
        proxy_send_timeout 1500s;
        proxy_read_timeout 1500s;
    }
}